name: News Scanner & Article Exporter

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Grant write permissions so GitHub Actions can push pending_articles.json back to your repository
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install gspread feedparser beautifulsoup4 requests

      - name: Run scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python news_radar.py

      - name: Export pending articles for GPT
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python export_pending_articles.py

      - name: Commit and push pending_articles.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update pending_articles.json" && git push)
