name: News Scanner & Article Exporter

on:
  workflow_dispatch:
    inputs:
      script_choice:
        description: "Select which script to run:"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "scanner_only"
          - "exporter_only"

permissions:
  contents: write

jobs:
  scan-and-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install gspread feedparser beautifulsoup4 requests google-genai

      # 1. Run news_radar.py
      - name: Run scanner
        if: |
          github.event.inputs.script_choice == 'both' || 
          github.event.inputs.script_choice == 'scanner_only'
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python news_radar.py

      # 2. Run AI Enricher (Gemini 3.8 Flash)
      - name: Run AI Enricher
        if: |
          github.event.inputs.script_choice == 'both' || 
          github.event.inputs.script_choice == 'scanner_only'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python ai_enricher.py

      # 3. Export pending articles
      - name: Export pending articles
        if: |
          github.event.inputs.script_choice == 'both' || 
          github.event.inputs.script_choice == 'exporter_only'
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python export_pending_articles.py

      # 4. Generate Static Pages & AdSense-Compliant HTML
      - name: Build Static Site
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python build_site.py

      # 5. Commit and push everything to GitHub Pages
      - name: Commit and push static updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_articles.json index.html article/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate crawlable articles and static pages" && git push)
