name: News Scanner & Article Exporter

on:
  workflow_dispatch:
    inputs:
      script_choice:
        description: "Select which script to run:"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "scanner_only"
          - "exporter_only"

permissions:
  contents: write

jobs:
  scan-and-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install gspread feedparser beautifulsoup4 requests google-genai

      # 1. Run news_radar.py
      - name: Run scanner
        if: |
          github.event.inputs.script_choice == 'both' || 
          github.event.inputs.script_choice == 'scanner_only'
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python news_radar.py

      # 2. Run AI Enricher (Gemini 2.5 Flash)
      - name: Run AI Enricher
        if: |
          github.event.inputs.script_choice == 'both' || 
          github.event.inputs.script_choice == 'scanner_only'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python ai_enricher.py

      # 3. Export pending articles for UI / status sync
      - name: Export pending articles
        if: |
          github.event.inputs.script_choice == 'both' || 
          github.event.inputs.script_choice == 'exporter_only'
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python export_pending_articles.py

      # 4. Commit and push updated JSON
      - name: Commit and push pending_articles.json
        if: |
          github.event.inputs.script_choice == 'both' || 
          github.event.inputs.script_choice == 'exporter_only'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update pending_articles.json" && git push)
