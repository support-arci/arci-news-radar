name: News Scanner & Article Exporter

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      script_choice:
        description: "Select which script to run:"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "scanner_only"
          - "exporter_only"

permissions:
  contents: write

jobs:
  scan-and-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install gspread feedparser beautifulsoup4 requests

      # Runs news_radar.py if scheduled OR if "both" / "scanner_only" is selected
      - name: Run scanner
        if: |
          github.event_name == 'schedule' || 
          github.event.inputs.script_choice == 'both' || 
          github.event.inputs.script_choice == 'scanner_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python news_radar.py

      # Runs export_pending_articles.py if scheduled OR if "both" / "exporter_only" is selected
      - name: Export pending articles for GPT
        if: |
          github.event_name == 'schedule' || 
          github.event.inputs.script_choice == 'both' || 
          github.event.inputs.script_choice == 'exporter_only'
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python export_pending_articles.py

      # Commits the JSON file if exporter ran
      - name: Commit and push pending_articles.json
        if: |
          github.event_name == 'schedule' || 
          github.event.inputs.script_choice == 'both' || 
          github.event.inputs.script_choice == 'exporter_only'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update pending_articles.json" && git push)
